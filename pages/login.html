<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to your Ethio Marketplace account.">
  <title>Login - Ethio Marketplace</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>

  <!-- ========== Navigation Bar ========== -->
  <nav class="navbar" aria-label="Main navigation">
    <div class="container">
      <a href="../index.html" class="navbar-brand">
        <span class="brand-icon">🛒</span>
        Ethio Marketplace
      </a>

      <button id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation menu">☰</button>

      <div id="nav-links" class="nav-links">
        <a href="../index.html">Home</a>
        <a href="marketplace.html">Marketplace</a>
        <a href="sell-item.html">Sell Item</a>
      </div>

      <div class="nav-actions">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
        <a href="login.html" class="btn btn-secondary btn-sm">Login</a>
        <a href="register.html" class="btn btn-primary btn-sm">Register</a>
      </div>
    </div>
  </nav>

  <main>
    <section class="auth-page">
      <div class="auth-card">
        <h1>Welcome Back</h1>
        <p class="subtitle">Login to your Ethio Marketplace account</p>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <input type="email" id="login-email" class="form-control" placeholder="you@example.com">
            <div id="login-email-error" class="form-error"></div>
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" class="form-control" placeholder="Enter your password">
            <div id="login-password-error" class="form-error"></div>
          </div>

          <div class="checkbox-group" style="margin-bottom: var(--space-md);">
            <input type="checkbox" id="remember-me">
            <label for="remember-me">Remember me</label>
          </div>

          <div class="forgot-password">
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">Login</button>
        </form>

        <div class="auth-links">
          <p>Don't have an account? <a href="register.html">Register here</a></p>
        </div>
      </div>
    </section>
  </main>

  <!-- ========== Footer ========== -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border: none; padding-top: 0;">
        <p>&copy; 2026 Ethio Marketplace. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="../js/utils.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/forms.js"></script>
</body>
</html>
