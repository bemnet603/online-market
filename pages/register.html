<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your Ethio Marketplace account and start buying or selling.">
  <title>Register - Ethio Marketplace</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>

  <!-- ========== Navigation Bar ========== -->
  <nav class="navbar" aria-label="Main navigation">
    <div class="container">
      <a href="../index.html" class="navbar-brand">
        <span class="brand-icon">🛒</span>
        Ethio Marketplace
      </a>

      <button id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation menu">☰</button>

      <div id="nav-links" class="nav-links">
        <a href="../index.html">Home</a>
        <a href="marketplace.html">Marketplace</a>
        <a href="sell-item.html">Sell Item</a>
      </div>

      <div class="nav-actions">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
        <a href="login.html" class="btn btn-secondary btn-sm">Login</a>
        <a href="register.html" class="btn btn-primary btn-sm">Register</a>
      </div>
    </div>
  </nav>

  <main>
    <section class="auth-page">
      <div class="auth-card">
        <h1>Create Account</h1>
        <p class="subtitle">Join Ethio Marketplace and start buying or selling today</p>

        <form id="register-form" novalidate>
          <div class="form-group">
            <label for="register-name">Full Name</label>
            <input type="text" id="register-name" class="form-control" placeholder="Enter your full name">
            <div id="register-name-error" class="form-error"></div>
          </div>

          <div class="form-group">
            <label for="register-email">Email Address</label>
            <input type="email" id="register-email" class="form-control" placeholder="you@example.com">
            <div id="register-email-error" class="form-error"></div>
          </div>

          <div class="form-group">
            <label for="register-phone">Phone Number</label>
            <input type="tel" id="register-phone" class="form-control" placeholder="+251 9XX XXX XXX">
            <div id="register-phone-error" class="form-error"></div>
          </div>

          <div class="form-group">
            <label for="register-location">Location</label>
            <select id="register-location" class="form-control">
              <option value="">Select your city</option>
            </select>
            <div id="register-location-error" class="form-error"></div>
          </div>

          <div class="form-group">
            <label for="register-password">Password</label>
            <input type="password" id="register-password" class="form-control" placeholder="Create a password">
            <div id="register-password-error" class="form-error"></div>
          </div>

          <div class="form-group">
            <label for="register-confirm-password">Confirm Password</label>
            <input type="password" id="register-confirm-password" class="form-control" placeholder="Confirm your password">
            <div id="register-confirm-password-error" class="form-error"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">Register</button>
        </form>

        <div class="auth-links">
          <p>Already have an account? <a href="login.html">Login here</a></p>
        </div>
      </div>
    </section>
  </main>

  <!-- ========== Footer ========== -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border: none; padding-top: 0;">
        <p>&copy; 2026 Ethio Marketplace. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="../js/data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/forms.js"></script>
</body>
</html>
